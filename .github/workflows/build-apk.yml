name: Build APK

on:
  push:
    branches: [main]
    # 推 v 開頭的標籤（例如 v0.2.0）時，建置並發布到 Releases
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 發布 Releases 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Set version
        run: |
          # 版本號用建置次數，確保每次都比上一版大
          echo "IDLEMATE_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "IDLEMATE_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "IDLEMATE_VERSION_NAME=0.0.${{ github.run_number }}-dev" >> "$GITHUB_ENV"
          fi

      # 正式簽章：從加密的 Secrets 還原到暫存位置（不會進到程式碼或 artifact）
      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.IDLEMATE_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/idlemate-release.p12"
          echo "IDLEMATE_KEYSTORE_FILE=$RUNNER_TEMP/idlemate-release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          IDLEMATE_KEYSTORE_PASSWORD: ${{ secrets.IDLEMATE_KEYSTORE_PASSWORD }}
          IDLEMATE_KEY_ALIAS: ${{ secrets.IDLEMATE_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/idlemate-release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: IdleMate-release-apk
          path: app/build/outputs/apk/release/*.apk

      # 只有推標籤時才發布
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="IdleMate-${IDLEMATE_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # Release notes (English): commit subjects since the previous tag
          git fetch --tags --unshallow --quiet || true
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            git log --pretty='- %s' ${PREV:+$PREV..}"$GITHUB_REF_NAME" | head -30
            echo
            echo "## Install"
            echo
            echo "Download \`$APK\` and open it on your phone to install. First-time setup: see the [README](https://github.com/${GITHUB_REPOSITORY}#下載)."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "IdleMate $IDLEMATE_VERSION_NAME" \
            --notes-file notes.md
