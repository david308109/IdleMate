name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # 正式簽章：從加密的 Secrets 還原到暫存位置（不會進到程式碼或 artifact）
      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.IDLEMATE_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/idlemate-release.p12"
          echo "IDLEMATE_KEYSTORE_FILE=$RUNNER_TEMP/idlemate-release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          IDLEMATE_KEYSTORE_PASSWORD: ${{ secrets.IDLEMATE_KEYSTORE_PASSWORD }}
          IDLEMATE_KEY_ALIAS: ${{ secrets.IDLEMATE_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/idlemate-release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: IdleMate-release-apk
          path: app/build/outputs/apk/release/*.apk
